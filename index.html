<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="오늘의 말씀" />
  <title>오늘의 말씀 · 생활영어 · 팝송</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2311151C'/%3E%3Ctext x='90' y='112' font-size='72' text-anchor='middle' fill='%23D6B87C'%3E%E2%9C%9D%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0f131a;
      --card: #181f2c;
      --text: #f4f1ea;
      --muted: #98a4b8;
      --accent: #d6b87c;
      --border: rgba(255, 255, 255, 0.08);
    }
    body.light {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1c1e22;
      --muted: #6c7480;
      --accent: #9c742b;
      --border: rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 24px);
      transition: background 0.25s, color 0.25s;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px 14px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }
    .brand { font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; }
    .theme-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    /* ===== 탭 ===== */
    .tabs {
      display: flex;
      gap: 5px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto 14px;
      padding: 5px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    .tab {
      flex: 1 1 0;
      min-height: 46px;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .tab:active { opacity: 0.75; }
    .tab.active { background: var(--accent); color: #11151c; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 16px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }
    .panel { display: none; flex-direction: column; gap: 16px; }
    .panel.active { display: flex; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
    }
    .date-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .verse-text {
      font-family: "Noto Serif KR", Georgia, serif;
      font-size: 23px;
      line-height: 1.68;
      font-weight: 500;
      margin: 0 0 24px;
      word-break: keep-all;
    }
    .verse-ref {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
    }
    .verse-en {
      font-family: Georgia, "Noto Serif KR", serif;
      font-size: 16px;
      line-height: 1.72;
      color: var(--muted);
      margin: 0;
    }
    .progress-wrap {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .bar {
      height: 5px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    /* ===== 생활영어 / 팝송 ===== */
    .label {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .phrase {
      font-family: "Noto Serif KR", Georgia, serif;
      font-size: 25px;
      line-height: 1.4;
      font-weight: 600;
      margin: 0 0 8px;
      word-break: keep-all;
    }
    .meaning {
      font-size: 15px;
      line-height: 1.5;
      color: var(--accent);
      font-weight: 600;
      margin: 0;
    }
    .block {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .block p {
      margin: 0;
      font-size: 14px;
      line-height: 1.68;
      color: var(--text);
      word-break: keep-all;
    }
    .example {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .example li {
      padding: 0 0 12px 12px;
      border-left: 2px solid var(--border);
      margin-bottom: 12px;
    }
    .example li:last-child { margin-bottom: 0; padding-bottom: 0; }
    .ex-en {
      display: block;
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 4px;
    }
    .ex-ko {
      display: block;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }
    .song-title {
      font-family: "Noto Serif KR", Georgia, serif;
      font-size: 25px;
      line-height: 1.35;
      font-weight: 600;
      margin: 0 0 6px;
      word-break: keep-all;
    }
    .song-artist { font-size: 15px; font-weight: 600; color: var(--accent); margin: 0; }
    .lyrics {
      font-family: Georgia, "Noto Serif KR", serif;
      font-size: 15.5px;
      line-height: 1.85;
      color: var(--text);
      margin: 0;
      white-space: pre-line;
    }
    .keys { list-style: none; margin: 0; padding: 0; }
    .keys li { margin-bottom: 10px; font-size: 14px; line-height: 1.55; }
    .keys li:last-child { margin-bottom: 0; }
    .key-en { color: var(--text); font-weight: 600; }
    .key-ko { color: var(--muted); }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    button.ctrl {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      min-height: 48px;
    }
    button.ctrl:active { opacity: 0.7; }
    button.ctrl.wide { grid-column: 1 / -1; }
    /* ===== 🔊 발음 듣기 ===== */
    .speak-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
    }
    button.speak-btn {
      flex: 1 1 150px;
      min-height: 46px;
      padding: 11px 16px;
      border-radius: 14px;
      border: 1px solid var(--accent);
      background: rgba(214, 184, 124, 0.12);
      color: var(--accent);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    body.light button.speak-btn { background: rgba(156, 116, 43, 0.08); }
    button.speak-btn.playing { background: var(--accent); color: #11151c; }
    body.light button.speak-btn.playing { background: var(--accent); color: #ffffff; }
    button.speak-btn:active { opacity: 0.75; }
    .speed-group { display: flex; gap: 6px; flex: 0 0 auto; }
    button.speed-btn {
      min-height: 46px;
      padding: 0 13px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    button.speed-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(214, 184, 124, 0.1);
    }
    button.speed-btn:active { opacity: 0.7; }
    .ex-row { display: flex; align-items: flex-start; gap: 10px; }
    .ex-row .ex-en { flex: 1 1 auto; margin-bottom: 0; }
    button.speak-mini {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      min-height: 32px;
      margin-top: -3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
    }
    button.speak-mini.playing {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(214, 184, 124, 0.14);
    }
    button.speak-mini:active { opacity: 0.7; }
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 20px);
      transform: translate(-50%, 12px);
      max-width: min(440px, calc(100% - 32px));
      background: #242c3a;
      color: #f4f1ea;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 99;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    body.light #toast { background: #ffffff; color: #1c1e22; }
    .memo-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
    }
    .search-wrap {
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-results {
      margin-top: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-height: 240px;
      overflow-y: auto;
      display: none;
    }
    .search-results.open { display: block; }
    .search-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:active { opacity: 0.7; }
    .search-item-ref { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .search-item-txt { font-size: 13px; color: var(--text); line-height: 1.45; }
    [hidden] { display: none !important; }
    .search-item-txt {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .search-status {
      padding: 12px 16px;
      font-size: 12.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      line-height: 1.5;
    }
    .search-hint {
      padding: 10px 16px;
      font-size: 12px;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      line-height: 1.45;
    }
    .search-item mark {
      background: rgba(214, 184, 124, 0.3);
      color: var(--text);
      border-radius: 3px;
      padding: 0 1px;
    }
    body.light .search-item mark { background: rgba(156, 116, 43, 0.22); }
    .search-more {
      display: block;
      width: 100%;
      padding: 12px 16px;
      background: transparent;
      border: none;
      border-top: 1px solid var(--border);
      color: var(--accent);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .search-more:active { opacity: 0.7; }
    .back-today {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
      margin-right: 8px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: rgba(214, 184, 124, 0.12);
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .back-today:active { opacity: 0.7; }
    .source-note {
      margin-top: 14px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
    }
    .memo-box label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 76px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">📖 오늘의 말씀</div>
    <button class="theme-btn" id="themeBtn">라이트 모드</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="오늘의 콘텐츠">
    <button class="tab active" role="tab" id="tabBible" data-tab="bible" aria-selected="true">📖 말씀</button>
    <button class="tab" role="tab" id="tabEnglish" data-tab="english" aria-selected="false">🗣️ 생활영어</button>
    <button class="tab" role="tab" id="tabSong" data-tab="song" aria-selected="false">🎵 팝송 가사</button>
  </nav>

  <main>
    <!-- ===================== 📖 말씀 ===================== -->
    <section class="panel active" id="panel-bible" role="tabpanel" aria-labelledby="tabBible">
      <div class="search-wrap">
        <input type="search" class="search-input" id="searchInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="🔍 검색: 요 3:16 · 창세기1장1절 · 사랑" />
        <div class="search-results" id="searchResults"></div>
      </div>

      <div class="card">
        <div class="date-row">
          <span id="dateLabel">2026.11.21</span>
          <button class="back-today" id="backTodayBtn" hidden>↩ 오늘 말씀</button>
          <span id="dayBadge">Day 1</span>
        </div>
        <p class="verse-text" id="verseText"></p>
        <div class="verse-ref" id="verseRef"></div>

        <div class="block">
          <div class="label" id="enLabel">ENGLISH · NIV</div>
          <p class="verse-en" id="verseEn"></p>
        </div>
        <div class="source-note" id="sourceNote" hidden></div>

        <div class="speak-row">
          <button class="speak-btn" id="verseKoBtn" data-speak-idle="🔊 한국어 듣기" aria-pressed="false">🔊 한국어 듣기</button>
          <button class="speak-btn" id="verseEnBtn" data-speak-idle="🔊 영어 듣기" aria-pressed="false">🔊 영어 듣기</button>
          <div class="speed-group" role="group" aria-label="재생 속도">
            <button class="speed-btn active" data-rate="1" aria-pressed="true">1.0x</button>
            <button class="speed-btn" data-rate="0.75" aria-pressed="false">0.75x</button>
          </div>
        </div>

        <div class="progress-wrap" id="progressWrap">
          <div class="progress-meta">
            <span>신약 통독 진행률</span>
            <span id="progressText">1 / 7,957절</span>
          </div>
          <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" id="prevBtn">← 이전</button>
        <button class="ctrl" id="todayBtn">오늘</button>
        <button class="ctrl" id="nextBtn">다음 →</button>
        <button class="ctrl wide" id="copyBtn">구절 복사</button>
      </div>

      <div class="memo-box">
        <label for="memoInput">오늘의 묵상 메모 (자동 저장)</label>
        <textarea id="memoInput" placeholder="오늘 말씀에서 마음에 남는 부분을 적어보세요..."></textarea>
      </div>
    </section>

    <!-- ===================== 🗣️ 생활영어 ===================== -->
    <section class="panel" id="panel-english" role="tabpanel" aria-labelledby="tabEnglish">
      <div class="card">
        <div class="date-row">
          <span id="enDate">2026.11.22</span>
          <span id="enBadge">Day 1</span>
        </div>
        <div class="label">오늘의 표현</div>
        <p class="phrase" id="enPhrase"></p>
        <p class="meaning" id="enMeaning"></p>

        <div class="speak-row">
          <button class="speak-btn" id="enSpeakBtn" data-speak-idle="🔊 발음 듣기" aria-pressed="false">🔊 발음 듣기</button>
          <div class="speed-group" role="group" aria-label="재생 속도">
            <button class="speed-btn active" data-rate="1" aria-pressed="true">1.0x</button>
            <button class="speed-btn" data-rate="0.75" aria-pressed="false">0.75x 천천히</button>
          </div>
        </div>

        <div class="block">
          <div class="label">이럴 때 씁니다</div>
          <p id="enWhen"></p>
        </div>

        <div class="block">
          <div class="label">뉘앙스</div>
          <p id="enNuance"></p>
        </div>

        <div class="block">
          <div class="label">응용 예문</div>
          <ul class="example" id="enExamples"></ul>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" id="enPrevBtn">← 이전</button>
        <button class="ctrl" id="enTodayBtn">오늘</button>
        <button class="ctrl" id="enNextBtn">다음 →</button>
        <button class="ctrl wide" id="enCopyBtn">문장 복사</button>
      </div>
    </section>

    <!-- ===================== 🎵 팝송 가사 ===================== -->
    <section class="panel" id="panel-song" role="tabpanel" aria-labelledby="tabSong">
      <div class="card">
        <div class="date-row">
          <span id="songDate">2026.11.22</span>
          <span id="songBadge">Day 1</span>
        </div>
        <div class="label">오늘의 팝송</div>
        <h2 class="song-title" id="songTitle"></h2>
        <p class="song-artist" id="songArtist"></p>

        <div class="block">
          <div class="label">핵심 가사 발췌</div>
          <p class="lyrics" id="songLyrics"></p>
          <div class="speak-row">
            <button class="speak-btn" id="songSpeakBtn" data-speak-idle="🔊 가사 듣기" aria-pressed="false">🔊 가사 듣기</button>
            <div class="speed-group" role="group" aria-label="재생 속도">
              <button class="speed-btn active" data-rate="1" aria-pressed="true">1.0x</button>
              <button class="speed-btn" data-rate="0.75" aria-pressed="false">0.75x 천천히</button>
            </div>
          </div>
        </div>

        <div class="block">
          <div class="label">한국어 해석</div>
          <p id="songKo"></p>
        </div>

        <div class="block">
          <div class="label">핵심 표현</div>
          <ul class="keys" id="songKeys"></ul>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" id="songPrevBtn">← 이전</button>
        <button class="ctrl" id="songTodayBtn">오늘</button>
        <button class="ctrl" id="songNextBtn">다음 →</button>
        <button class="ctrl wide" id="songCopyBtn">가사 복사</button>
      </div>
    </section>
  </main>

  <script>
    /* 화면에 드러나지 않는 오류 수집기 (검증·디버깅용) */
    window.__appErrors = [];
    window.addEventListener("error", (e) => window.__appErrors.push(String(e.message || (e.error && e.error.message) || e.type)));
    window.addEventListener("unhandledrejection", (e) => window.__appErrors.push("promise: " + String((e.reason && e.reason.message) || e.reason)));
  </script>
  <script>
    /* ===================== 📖 말씀 데이터 ===================== */
    const START_DATE = new Date("2026-11-21T00:00:00+09:00");
    const VERSES = [

    /* ===================== 공통 유틸 ===================== */
    function dayDiff(startDate) {
      const today = new Date();
      return Math.max(0, Math.floor((today - startDate) / 86400000));
    }
    function fmtDate(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}.${mm}.${dd}`;
    }
    async function copyText(text, btn, idleLabel) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        btn.textContent = "복사됨 ✓";
        setTimeout(() => (btn.textContent = idleLabel), 1400);
      } catch (e) {
        alert(text);
      }
    }

    /* ===================== 🔊 듣기 (TTS: 한국어 / 원어민 영어) ===================== */
    const speechSupported =
      typeof window !== "undefined" &&
      "speechSynthesis" in window &&
      typeof window.SpeechSynthesisUtterance === "function";

    const PREFERRED_VOICES = {
      "en-US": ["samantha", "aaron", "ava", "nicky", "allison", "susan", "google us english", "google us"],
      "ko-KR": ["yuna", "sora", "kyuri", "sujin", "google 한국의", "google korean"]
    };
    const voiceCache = { "en-US": [], "ko-KR": [] };

    function refreshVoices() {
      if (!speechSupported) return;
      const all = window.speechSynthesis.getVoices() || [];
      const byLang = (re) => all.filter((v) => re.test(v.lang || ""));
      voiceCache["en-US"] = byLang(/en[-_]US/i);
      if (!voiceCache["en-US"].length) voiceCache["en-US"] = byLang(/^en/i);
      voiceCache["ko-KR"] = byLang(/ko[-_]KR/i);
      if (!voiceCache["ko-KR"].length) voiceCache["ko-KR"] = byLang(/^ko/i);
    }
    if (speechSupported) {
      refreshVoices();
      if (typeof window.speechSynthesis.addEventListener === "function") {
        window.speechSynthesis.addEventListener("voiceschanged", refreshVoices);
      } else {
        window.speechSynthesis.onvoiceschanged = refreshVoices;
      }
    }

    function pickVoice(lang) {
      const key = /^ko/i.test(lang) ? "ko-KR" : "en-US";
      if (!voiceCache[key].length) refreshVoices();
      const list = voiceCache[key];
      if (!list.length) return null;
      for (const name of PREFERRED_VOICES[key]) {
        const hit = list.find((v) => (v.name || "").toLowerCase().includes(name));
        if (hit) return hit;
      }
      return list.find((v) => v.localService) || list[0];
    }

    let toastTimer = null;
    function showToast(msg) {
      let el = document.getElementById("toast");
      if (!el) {
        el = document.createElement("div");
        el.id = "toast";
        el.setAttribute("role", "status");
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 3200);

    const speechState = { btn: null, text: "", lang: "en-US", rate: 1 };
    let warnedNoVoice = false;

    function syncSpeakButtons() {
      document.querySelectorAll("[data-speak-idle]").forEach((b) => {
        const on = b === speechState.btn;
        b.textContent = on ? (b.getAttribute("data-speak-stop") || "⏹ 멈춤") : b.getAttribute("data-speak-idle");
        b.classList.toggle("playing", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");

    function syncSpeedButtons() {
      document.querySelectorAll("button.speed-btn").forEach((b) => {

        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }

    function stopSpeech() {
      speechState.btn = null;
      speechState.text = "";
      if (speechSupported) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      syncSpeakButtons();
    }

    function speakText(text, btn, lang) {
      if (!text) return;
      lang = lang || "en-US";
      if (!speechSupported) {
        showToast("이 브라우저는 듣기 기능을 지원하지 않아요. iPhone은 설정 › 손쉬운 사용 › 콘텐츠 말하기에서 음성을 켜 주세요.");
        return;
      }
      if (speechState.btn === btn) {
        stopSpeech();
        return;
      }
      try { window.speechSynthesis.cancel(); } catch (e) {}

      const u = new window.SpeechSynthesisUtterance(text);
      u.lang = lang;
      const voice = pickVoice(lang);
      if (voice) u.voice = voice;
      u.rate = speechState.rate;
      u.pitch = 1;
      u.volume = 1;
      u.onend = () => { if (speechState.btn === btn) stopSpeech(); };
      u.onerror = () => { if (speechState.btn === btn) stopSpeech(); };

      speechState.btn = btn;
      speechState.text = text;
      speechState.lang = lang;
      try { window.speechSynthesis.resume(); } catch (e) {}
      window.speechSynthesis.speak(u);
      syncSpeakButtons();

      if (!voice && !warnedNoVoice) {
        warnedNoVoice = true;
        showToast(lang.indexOf("ko") === 0 ? "한국어 음성을 찾지 못해 기본 음성으로 재생합니다." : "원어민 영어 음성을 찾지 못해 기본 음성으로 재생합니다.");

    }

    function setSpeechRate(rate) {

        const btn = speechState.btn;
        const text = speechState.text;
        const lang = speechState.lang;
        speechState.btn = null;
        speechState.text = "";
        try { window.speechSynthesis.cancel(); } catch (e) {}

      }
    }

    document.querySelectorAll("button.speed-btn").forEach((b) => {

    /* ===================== 탭 ===================== */
    const tabButtons = Array.from(document.querySelectorAll(".tab"));

    /* ===================== 📖 성경 전체 데이터 (내장 검색) ===================== */
    /* 자료: 개역한글(1961) · BSB(Berean Standard Bible, CC0) — 저장소 bible/ 폴더 */
    const BIBLE_REPO = "github815/WatchfulDisastrousNotification";
    const BIBLE_BRANCH = "main";
    const IS_PREVIEW = location.hostname === "htmlpreview.github.io";
    const BIBLE_BASE =
      IS_PREVIEW || location.protocol === "file:"
        ? `https://raw.githubusercontent.com/${BIBLE_REPO}/${BIBLE_BRANCH}/bible/`
        : new URL("bible/", location.href).href;

    const bible = {
      index: null,
      indexPromise: null,
      books: new Map(),
      bookPromises: new Map(),
      bundleData: new Map(),
      bundlePromises: new Map(),
      error: null
    };

    function fetchJSON(url) {
      return fetch(url, { cache: "force-cache" }).then((res) => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      });
    }

    function loadIndex() {
      if (bible.index) return Promise.resolve(bible.index);
      if (!bible.indexPromise) {
        bible.indexPromise = fetchJSON(BIBLE_BASE + "index.json")
          .then((data) => { bible.index = data; return data; })
          .catch((err) => { bible.error = err; bible.indexPromise = null; throw err; });
      }
      return bible.indexPromise;
    }

    function bookMeta(id) {
      if (!bible.index || !id) return null;
      return bible.index.books[id - 1] || null;
    }

    function loadBookChapters(lang, id) {
      const key = lang + ":" + id;
      if (bible.books.has(key)) return Promise.resolve(bible.books.get(key));
      if (!bible.bookPromises.has(key)) {
        const file = String(id).padStart(2, "0") + ".json";
        const promise = fetchJSON(BIBLE_BASE + lang + "/" + file)
          .then((data) => { bible.books.set(key, data.chapters); return data.chapters; })
          .finally(() => bible.bookPromises.delete(key));
        bible.bookPromises.set(key, promise);
      }
      return bible.bookPromises.get(key);
    }

    function loadBundle(name) {
      if (bible.bundleData.has(name)) return Promise.resolve(bible.bundleData.get(name));
      if (!bible.bundlePromises.has(name)) {
        const promise = fetchJSON(BIBLE_BASE + "search/" + name + ".json")
          .then((data) => { bible.bundleData.set(name, data); return data; })
          .finally(() => bible.bundlePromises.delete(name));
        bible.bundlePromises.set(name, promise);
      }
      return bible.bundlePromises.get(name);
    }

    /* ---------- 검색어 해석 (러프한 입력 허용) ----------
       창세기1장1절 / 창세기 1장 1절 / 창1:1 / 창세기1,1 / 창세기1;1 / 창세기 1 1
       창세기 1 / 창1 / 시편 23편 / 시 23 / 요 3:16 / 고전 13:4 / John 3:16 / 1:1 (책 이름 생략) */
    const normKey = (s) => String(s).replace(/[\s.\u00b7\u318d]/g, "").toLowerCase();

    function normalizeQuery(raw) {
      let s = String(raw || "").trim();
      s = s.replace(/[\u00a0\u3000]/g, " ");
      s = s.replace(/[：]/g, ":").replace(/[，、]/g, ",").replace(/[；]/g, ";")
           .replace(/[~〜～]/g, "-").replace(/[\u2013\u2014]/g, "-");
      s = s.replace(/(\d+)\s*(?:장|편)/g, "$1:");
      s = s.replace(/\s*절/g, "");
      return s.trim();
    }

    function matchBookPrefix(s) {
      if (!bible.index) return null;
      const flat = s.replace(/\s+/g, "").toLowerCase();
      if (!flat) return null;
      let best = null;
      for (const b of bible.index.books) {
        const names = [b.ko, b.en].concat(b.abbr || [], b.abbrEn || []);
        for (const name of names) {
          const key = normKey(name);
          if (!key || !flat.startsWith(key)) continue;
          if (!best || key.length > best.keyLen || (key.length === best.keyLen && b.id < best.book.id)) {
            best = { book: b, keyLen: key.length };
          }
        }
      }
      if (!best) {
        // 책 이름 일부만 입력한 경우 (예: "고린도 13:4", "데살로니가 5:16")
        const headMatch = /^[^\d:;,.]+/.exec(s);
        const head = headMatch ? headMatch[0].trim() : "";
        const headKey = normKey(head);
        if (headKey) {
          let partial = null;
          for (const b of bible.index.books) {
            const names = [b.ko, b.en].concat(b.abbr || [], b.abbrEn || []);
            for (const name of names) {
              const key = normKey(name);
              if (key.length > headKey.length && key.startsWith(headKey)) {
                if (!partial || b.id < partial.id) partial = b;
              }
            }
          }
          if (partial) return { book: partial, rest: s.slice(head.length) };
        }
        return null;
      }
      let consumed = 0, i = 0;
      while (i < s.length && consumed < best.keyLen) {
        if (!/\s/.test(s[i])) consumed++;
        i++;
      }
      return { book: best.book, rest: s.slice(i) };
    }

    function parseRefNumbers(rest) {
      const t = rest.trim();
      if (!t) return null;
      if (/[^\d\s:;,.\-]/.test(t)) return null;
      const nums = [];
      const seps = [];
      const re = /(\d+)|([:;,.\-])/g;
      let m;
      while ((m = re.exec(t))) {
        if (m[1]) nums.push(Number(m[1]));
        else seps.push(m[2]);
      }
      if (!nums.length) return null;
      return { nums: nums, seps: seps };
    }

    function parseReference(raw) {
      if (!bible.index) return null;
      const s = normalizeQuery(raw);
      if (!s) return null;
      const hit = matchBookPrefix(s);
      const rest = hit ? hit.rest : s;
      const parsed = parseRefNumbers(rest);
      if (!parsed) return null;
      return {
        book: hit ? hit.book : null,
        chapter: parsed.nums[0],
        verse: parsed.nums.length > 1 ? parsed.nums[1] : null,
        verseEnd: parsed.nums.length > 2 ? parsed.nums[2] : null
      };
    }

    function findBookByName(name) {
      if (!bible.index) return null;
      const k = normKey(name);
      return (
        bible.index.books.find((b) => normKey(b.ko) === k || normKey(b.en) === k) ||
        bible.index.books.find((b) => (b.abbr || []).some((a) => normKey(a) === k)) ||
        null
      );
    }

    /* ===================== 📖 말씀 카드 ===================== */
    const todayVerseIndex = Math.min(dayDiff(START_DATE), VERSES.length - 1);
    let currentIndex = todayVerseIndex;
    let customVerse = null;

    const verseText = document.getElementById("verseText");
    const verseRef = document.getElementById("verseRef");
    const verseEn = document.getElementById("verseEn");
    const dateLabel = document.getElementById("dateLabel");
    const dayBadge = document.getElementById("dayBadge");
    const progressText = document.getElementById("progressText");
    const barFill = document.getElementById("barFill");
    const progressWrap = document.getElementById("progressWrap");
    const backTodayBtn = document.getElementById("backTodayBtn");
    const sourceNote = document.getElementById("sourceNote");
    const enLabel = document.getElementById("enLabel");
    const memoInput = document.getElementById("memoInput");
    const themeBtn = document.getElementById("themeBtn");
    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");
    const copyBtn = document.getElementById("copyBtn");
    const verseCard = document.querySelector("#panel-bible .card");

    /* 개역개정·NIV로 손수 넣어 둔 40개 구절 (검색 결과에서도 같은 본문을 보여 준다) */
    const CURATED = new Map();
    [...VERSES, ...POPULAR_VERSES].forEach((v) => {
      const m = /^(.+?)\s+(\d+):(\d+)$/.exec(v.ref);
      if (!m) return;
      const key = `${m[1]} ${m[2]}:${m[3]}`;
      if (!CURATED.has(key)) CURATED.set(key, { text: v.text, en: v.en || "", koVer: "개역개정", enVer: "NIV" });
    });

    function curatedVerse(bookId, chapter, verse) {
      const b = bookMeta(bookId);
      if (!b) return null;
      return CURATED.get(`${b.ko} ${chapter}:${verse}`) || null;
    }

    function currentBookId() {
      if (customVerse && customVerse.bookId) return customVerse.bookId;
      const ref = (VERSES[currentIndex] || {}).ref || "";
      const name = ref.replace(/\s*\d+.*$/, "");
      const b = findBookByName(name);
      return b ? b.id : 40;
    }

    function render() {
      stopSpeech();
      if (customVerse) {
        const v = customVerse;
        if (v.text) verseText.textContent = `“${v.text}”`;
        else if (v.error) verseText.textContent = "본문을 불러오지 못했어요. 네트워크를 확인해 주세요.";
        else verseText.textContent = "본문을 불러오는 중…";
        verseRef.textContent = `${v.ref} · ${v.koVer || "개역한글"}`;
        verseEn.textContent = v.en || (v.loading ? "…" : "—");
        enLabel.textContent = `ENGLISH · ${v.enVer || "BSB"}`;
        dateLabel.textContent = "검색 결과";
        dayBadge.textContent = "바로 보기";
        progressWrap.hidden = true;
        backTodayBtn.hidden = false;
        sourceNote.hidden = false;
        sourceNote.textContent = v.isCurated
          ? "본문: 개역개정 · NIV"
          : "본문: 개역한글(1961) · BSB (Berean Standard Bible) · 전체 성경 데이터";
        const memoKey = `verse_memo_ref_${v.ref}`;
        try { memoInput.value = localStorage.getItem(memoKey) || ""; } catch (e) { memoInput.value = ""; }
        return;
      }

      const v = VERSES[currentIndex];
      const d = new Date(START_DATE.getTime() + currentIndex * 86400000);
      verseText.textContent = `“${v.text}”`;
      verseRef.textContent = `${v.ref} (개역개정)`;
      verseEn.textContent = v.en || "";
      enLabel.textContent = "ENGLISH · NIV";
      dateLabel.textContent = fmtDate(d);
      dayBadge.textContent = `Day ${currentIndex + 1}`;
      progressWrap.hidden = false;
      backTodayBtn.hidden = true;
      sourceNote.hidden = true;
      progressText.textContent = `${currentIndex + 1} / 7,957절`;
      barFill.style.width = `${Math.max(1.5, ((currentIndex + 1) / 7957) * 100)}%`;

      const memoKey = `verse_memo_${currentIndex}`;
      try {
        memoInput.value = localStorage.getItem(memoKey) || "";
      } catch (e) {
        memoInput.value = "";
      }
    }

    /* ===================== 📖 검색 ===================== */
    const MAX_HITS = 40;
    const searchState = { seq: 0, q: "", terms: [], hits: [], hitKeys: new Set(), shown: MAX_HITS, status: "", hint: "", timer: null };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function highlight(text, terms) {
      let out = escapeHtml(text);
      (terms || []).forEach((t) => {
        if (!t) return;
        const safe = escapeHtml(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        try {
          out = out.replace(new RegExp(safe, "gi"), (m) => `<mark>${m}</mark>`);
        } catch (e) {}
      });
      return out;
    }

    function makeHit(bookId, chapter, verse, text) {
      const b = bookMeta(bookId);
      const curated = curatedVerse(bookId, chapter, verse);
      return {
        bookId: bookId,
        chapter: chapter,
        verse: verse,
        label: `${b ? b.ko : ""} ${chapter}:${verse}`,
        text: (curated ? curated.text : text) || ""
      };
    }

    function renderSearchPanel() {
      const st = searchState;
      let html = "";
      if (st.status) html += `<div class="search-status">⏳ ${escapeHtml(st.status)}</div>`;
      if (st.hint) html += `<div class="search-hint">${escapeHtml(st.hint)}</div>`;
      const hits = st.hits.slice(0, st.shown);
      html += hits
        .map((h, i) => `
        <div class="search-item" data-hit="${i}">
          <div class="search-item-ref">${escapeHtml(h.label)}</div>
          <div class="search-item-txt">${highlight(h.text, st.terms)}</div>
        </div>`)
        .join("");
      if (st.hits.length > st.shown) {
        html += `<button class="search-more" id="searchMore">결과 더 보기 (${st.shown} / ${st.hits.length})</button>`;
      }
      if (!st.status && !hits.length && !st.hint) {
        html += `<div class="search-status">검색 결과가 없습니다.</div>`;
      }
      searchResults.innerHTML = html;
      searchResults.classList.add("open");

      const more = document.getElementById("searchMore");
      if (more) more.onclick = () => { st.shown += MAX_HITS; renderSearchPanel(); };
      searchResults.querySelectorAll(".search-item").forEach((el) => {
        el.onclick = () => {
          const h = st.hits[Number(el.dataset.hit)];
          if (h) openVerse(h.bookId, h.chapter, h.verse);
        };
      });
    }

    function closeResults() {
      searchResults.classList.remove("open");
      searchResults.innerHTML = "";
    }

    function resetSearchState() {
      const st = searchState;
      st.hits = [];
      st.hitKeys = new Set();
      st.shown = MAX_HITS;
      st.status = "";
      st.hint = "";
    }

    async function runSearch(raw) {
      const q = String(raw || "").trim();
      const st = searchState;
      st.seq += 1;
      const seq = st.seq;
      st.q = q;
      st.terms = q.split(/\s+/).filter(Boolean);
      resetSearchState();
      if (!q) { closeResults(); return; }

      try {
        await loadIndex();
      } catch (e) {
        if (seq !== st.seq) return;
        st.hits = searchLocalVerses(q, st.terms);
        st.hint = "성경 전체 데이터를 불러오지 못했어요. 네트워크를 확인해 주세요. (기본 40개 구절에서만 검색)";
        renderSearchPanel();
        return;
      }
      if (seq !== st.seq) return;

      const ref = parseReference(q);
      if (ref) return startReferenceSearch(ref, seq);
      return startKeywordSearch(q, st.terms, seq);
    }

    /* 책 이름·장·절 검색 */
    async function startReferenceSearch(ref, seq) {
      const st = searchState;
      let book = ref.book;
      let hint = "";
      if (!book) {
        book = bookMeta(currentBookId());
        if (!book) { st.hint = "책 이름을 함께 입력해 주세요. 예: 창세기 1:1"; renderSearchPanel(); return; }
        hint = `책 이름이 없어 ${book.ko}에서 찾았어요`;
      }
      const counts = book.chapters;
      const chapter = ref.chapter;
      if (!chapter || chapter < 1 || chapter > counts.length) {
        st.hint = `${book.ko}은(는) 1~${counts.length}장까지 있어요.`;
        renderSearchPanel();
        return;
      }
      const maxVerse = counts[chapter - 1];
      let first = ref.verse || 1;
      let last = ref.verse ? (ref.verseEnd && ref.verseEnd >= ref.verse ? ref.verseEnd : ref.verse) : maxVerse;
      first = Math.min(Math.max(1, first), maxVerse);
      last = Math.min(Math.max(first, last), maxVerse);

      st.hint = hint;
      st.status = "본문 불러오는 중...";
      st.terms = [];
      renderSearchPanel();

      let chapters;
      try {
        chapters = await loadBookChapters("ko", book.id);
      } catch (e) {
        if (seq !== st.seq) return;
        st.status = "";
        st.hint = "본문을 불러오지 못했어요. 네트워크를 확인해 주세요.";
        renderSearchPanel();
        return;
      }
      if (seq !== st.seq) return;

      const verses = chapters[chapter - 1] || [];
      const hits = [];
      for (let v = first; v <= last; v++) hits.push(makeHit(book.id, chapter, v, verses[v - 1] || ""));
      st.hits = hits;
      st.status = "";
      st.hint = ref.verse ? hint : `${book.ko} ${chapter}장 · ${hits.length}절`;
      renderSearchPanel();
    }

    /* 키워드 검색 */
    function searchLocalVerses(q, terms) {
      const out = [];
      const seen = new Set();
      const lower = terms.map((t) => t.toLowerCase());
      [...VERSES, ...POPULAR_VERSES].forEach((v) => {
        const hay = `${v.text} ${v.en || ""} ${v.ref}`.toLowerCase();
        if (!lower.every((t) => hay.includes(t))) return;
        const m = /^(.+?)\s+(\d+):(\d+)/.exec(v.ref);
        if (!m) return;
        const b = findBookByName(m[1]);
        if (!b) return;
        const key = `${b.id}:${m[2]}:${m[3]}`;
        if (seen.has(key)) return;
        seen.add(key);
        out.push({ bookId: b.id, chapter: +m[2], verse: +m[3], label: `${b.ko} ${m[2]}:${m[3]}`, text: v.text });
      });
      return out;
    }

    async function startKeywordSearch(q, terms, seq) {
      const st = searchState;
      const hasLatin = /[a-z]/i.test(q);
      const sources = ["ko-nt", "ko-ot"].concat(hasLatin ? ["en-nt", "en-ot"] : []);
      const lower = terms.map((t) => t.toLowerCase());
      let done = 0;

      st.hits = searchLocalVerses(q, lower);
      st.hits.forEach((h) => st.hitKeys.add(`${h.bookId}:${h.chapter}:${h.verse}`));
      st.status = "성경 전체 검색 데이터 불러오는 중... (0/" + sources.length + ")";
      renderSearchPanel();

      const merge = (bundle) => {
        const books = (bundle && bundle.books) || {};
        Object.keys(books).forEach((idStr) => {
          const bookId = Number(idStr);
          const chapters = books[idStr];
          for (let c = 0; c < chapters.length; c++) {
            const verses = chapters[c];
            for (let v = 0; v < verses.length; v++) {
              const text = verses[v];
              if (!text) continue;
              const low = text.toLowerCase();
              if (!lower.every((t) => low.includes(t))) continue;
              const key = `${bookId}:${c + 1}:${v + 1}`;
              if (st.hitKeys.has(key)) continue;
              st.hitKeys.add(key);
              st.hits.push(makeHit(bookId, c + 1, v + 1, text));
            }
          }
        });
      };

      await Promise.all(
        sources.map((name) =>
          loadBundle(name)
            .then((bundle) => {
              if (seq !== st.seq) return;
              merge(bundle);
            })
            .catch(() => {})
            .then(() => {
              if (seq !== st.seq) return;
              done += 1;
              st.hits.sort((a, b) => a.bookId - b.bookId || a.chapter - b.chapter || a.verse - b.verse);
              st.status = done < sources.length ? `성경 전체 검색 데이터 불러오는 중... (${done}/${sources.length})` : "";
              if (done === sources.length) {
                st.hint = st.hits.length
                  ? `“${q}” ${st.hits.length}곳`
                  : `“${q}” 검색 결과가 없습니다.`;
              }
              renderSearchPanel();
            })
        )
      );
    }

    /* ===================== 📖 구절 열기 / 이동 ===================== */
    async function openVerse(bookId, chapter, verse) {
      const book = bookMeta(bookId);
      if (!book) return;
      const curated = curatedVerse(bookId, chapter, verse);
      stopSpeech();
      closeResults();
      try { searchInput.blur(); } catch (e) {}

      const base = {
        bookId: bookId,
        chapter: chapter,
        verse: verse,
        ref: `${book.ko} ${chapter}:${verse}`,
        text: "",
        en: "",
        loading: true,
        isCurated: !!curated
      };

      if (curated) {
        customVerse = Object.assign({}, base, {
          text: curated.text,
          en: curated.en,
          koVer: curated.koVer,
          enVer: curated.enVer,
          loading: false
        });
        render();
        if (verseCard) verseCard.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }

      customVerse = Object.assign({}, base, { koVer: "개역한글", enVer: "BSB" });
      render();
      if (verseCard) verseCard.scrollIntoView({ behavior: "smooth", block: "start" });

      try {
        const results = await Promise.all([
          loadBookChapters("ko", bookId),
          loadBookChapters("en", bookId).catch(() => null)
        ]);
        const koCh = results[0];
        const enCh = results[1];
        const koText = ((koCh && koCh[chapter - 1]) || [])[verse - 1] || "";
        const enText = ((enCh && enCh[chapter - 1]) || [])[verse - 1] || "";
        if (customVerse && customVerse.bookId === bookId && customVerse.chapter === chapter && customVerse.verse === verse) {
          customVerse = Object.assign({}, customVerse, { text: koText, en: enText, loading: false });
          if (!koText) showToast("이 절은 개역한글 본문에 없습니다.");
          render();
        }
      } catch (e) {
        if (customVerse && customVerse.bookId === bookId && customVerse.chapter === chapter && customVerse.verse === verse) {
          customVerse = Object.assign({}, customVerse, { loading: false, error: true });
          render();
          showToast("본문을 불러오지 못했어요. 네트워크를 확인해 주세요.");
        }
      }
    }

    async function stepVerse(dir) {
      if (!customVerse || !bible.index) return;
      let bookId = customVerse.bookId;
      let chapter = customVerse.chapter;
      let verse = customVerse.verse;
      let book = bookMeta(bookId);
      if (!book) return;
      if (dir > 0) {
        if (verse < book.chapters[chapter - 1]) verse += 1;
        else if (chapter < book.chapters.length) { chapter += 1; verse = 1; }
        else if (bookId < bible.index.books.length) {
          bookId += 1; book = bookMeta(bookId); chapter = 1; verse = 1;
        } else return;
      } else {
        if (verse > 1) verse -= 1;
        else if (chapter > 1) { chapter -= 1; verse = book.chapters[chapter - 1]; }
        else if (bookId > 1) {
          bookId -= 1; book = bookMeta(bookId);
          chapter = book.chapters.length; verse = book.chapters[chapter - 1];
        } else return;
      }
      openVerse(bookId, chapter, verse);
    }

    searchInput.addEventListener("input", () => {
      clearTimeout(searchState.timer);
      const value = searchInput.value;
      if (!value.trim()) { closeResults(); resetSearchState(); searchState.q = ""; return; }
      searchState.timer = setTimeout(() => { runSearch(value); }, 220);
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      clearTimeout(searchState.timer);
      const q = searchInput.value.trim();
      if (!q) return;
      const openFirst = () => {
        if (searchState.hits.length) {
          const h = searchState.hits[0];
          openVerse(h.bookId, h.chapter, h.verse);
        } else if (searchState.q === q) {
          showToast("검색 결과가 없습니다.");
        }
      };
      if (searchState.q === q) openFirst();
      else runSearch(q).then(openFirst);
    });

    document.addEventListener("click", (e) => {
      if (e.target.closest && e.target.closest(".search-wrap")) return;
      if (searchResults.classList.contains("open")) searchResults.classList.remove("open");
    });

    document.getElementById("prevBtn").onclick = () => {
      if (customVerse) { stepVerse(-1); return; }
      if (currentIndex > 0) currentIndex--;
      render();
    };
    document.getElementById("nextBtn").onclick = () => {
      if (customVerse) { stepVerse(1); return; }
      if (currentIndex < VERSES.length - 1) currentIndex++;
      render();
    };
    document.getElementById("todayBtn").onclick = () => {
      customVerse = null;
      currentIndex = todayVerseIndex;
      render();
    };
    backTodayBtn.onclick = () => {
      customVerse = null;
      currentIndex = todayVerseIndex;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    copyBtn.onclick = () => {
      const v = customVerse || VERSES[currentIndex];
      if (!v.text) { showToast("본문을 아직 불러오지 못했어요."); return; }
      copyText(`${v.text} (${v.ref})`, copyBtn, "구절 복사");
    };

    const verseKoBtn = document.getElementById("verseKoBtn");
    const verseEnBtn = document.getElementById("verseEnBtn");
    verseKoBtn.onclick = () => {
      const v = customVerse || VERSES[currentIndex];
      speakText(v.text, verseKoBtn, "ko-KR");
    };
    verseEnBtn.onclick = () => {
      const v = customVerse || VERSES[currentIndex];
      speakText(v.en, verseEnBtn, "en-US");
    };
    memoInput.oninput = () => {
      const v = customVerse || VERSES[currentIndex];
      const memoKey = customVerse ? `verse_memo_ref_${v.ref}` : `verse_memo_${currentIndex}`;
      try {
        localStorage.setItem(memoKey, memoInput.value);
      } catch (e) {}
    };
    themeBtn.onclick = () => {
      document.body.classList.toggle("light");
      themeBtn.textContent = document.body.classList.contains("light") ? "다크 모드" : "라이트 모드";
    };

    /* ===================== 🗣️ 생활영어 ===================== */
    const enTodayIndex = Math.min(dayDiff(EN_START), PHRASES.length - 1);
    let enIndex = enTodayIndex;

    const enPhrase = document.getElementById("enPhrase");
    const enMeaning = document.getElementById("enMeaning");
    const enWhen = document.getElementById("enWhen");
    const enNuance = document.getElementById("enNuance");
    const enExamples = document.getElementById("enExamples");
    const enDate = document.getElementById("enDate");
    const enBadge = document.getElementById("enBadge");
    const enCopyBtn = document.getElementById("enCopyBtn");

    function renderEnglish() {
      stopSpeech();
      const p = PHRASES[enIndex];
      const d = new Date(EN_START.getTime() + enIndex * 86400000);
      enDate.textContent = fmtDate(d);
      enBadge.textContent = `Day ${enIndex + 1}`;
      enPhrase.textContent = p.phrase;
      enMeaning.textContent = p.ko;
      enWhen.textContent = p.when;
      enNuance.textContent = p.nuance;
      enExamples.innerHTML = p.examples
        .map((ex, i) => `<li>
          <div class="ex-row">
            <span class="ex-en">${ex.en}</span>
            <button class="speak-mini" data-ex="${i}" data-speak-idle="🔊" data-speak-stop="⏹" aria-label="예문 ${i + 1} 원어민 발음 듣기" aria-pressed="false">🔊</button>
          </div>
          <span class="ex-ko">${ex.ko}</span>
        </li>`)
        .join("");
    }

    const enSpeakBtn = document.getElementById("enSpeakBtn");
    enSpeakBtn.onclick = () => speakText(PHRASES[enIndex].phrase, enSpeakBtn, "en-US");
    enExamples.addEventListener("click", (e) => {
      const btn = e.target.closest("button.speak-mini");
      if (!btn) return;
      const p = PHRASES[enIndex];
      const ex = p && p.examples[Number(btn.dataset.ex)];
      if (ex) speakText(ex.en, btn, "en-US");
    });

    document.getElementById("enPrevBtn").onclick = () => {
      if (enIndex > 0) enIndex--;
      renderEnglish();
    };
    document.getElementById("enNextBtn").onclick = () => {
      if (enIndex < PHRASES.length - 1) enIndex++;
      renderEnglish();
    };
    document.getElementById("enTodayBtn").onclick = () => {
      enIndex = enTodayIndex;
      renderEnglish();
    };
    enCopyBtn.onclick = () => {
      const p = PHRASES[enIndex];
      const text = [`${p.phrase}`, `${p.ko}`]
        .concat(p.examples.map((ex) => `- ${ex.en} (${ex.ko})`))
        .join("\n");
      copyText(text, enCopyBtn, "문장 복사");
    };

    /* ===================== 🎵 팝송 가사 ===================== */
    const songTodayIndex = Math.min(dayDiff(EN_START), SONGS.length - 1);
    let songIndex = songTodayIndex;

    const songTitle = document.getElementById("songTitle");
    const songArtist = document.getElementById("songArtist");
    const songLyrics = document.getElementById("songLyrics");
    const songKo = document.getElementById("songKo");
    const songKeys = document.getElementById("songKeys");
    const songDate = document.getElementById("songDate");
    const songBadge = document.getElementById("songBadge");
    const songCopyBtn = document.getElementById("songCopyBtn");

    function renderSong() {
      stopSpeech();
      const s = SONGS[songIndex];
      const d = new Date(EN_START.getTime() + songIndex * 86400000);
      songDate.textContent = fmtDate(d);
      songBadge.textContent = `Day ${songIndex + 1}`;
      songTitle.textContent = s.title;
      songArtist.textContent = `${s.artist} · ${s.year}`;
      songLyrics.textContent = s.lines.join("\n");
      songKo.textContent = s.ko;
      songKeys.innerHTML = s.keys
        .map((k) => `<li><span class="key-en">${k.en}</span> <span class="key-ko">— ${k.ko}</span></li>`)
        .join("");
    }

    document.getElementById("songPrevBtn").onclick = () => {
      if (songIndex > 0) songIndex--;
      renderSong();
    };
    document.getElementById("songNextBtn").onclick = () => {
      if (songIndex < SONGS.length - 1) songIndex++;
      renderSong();
    };
    document.getElementById("songTodayBtn").onclick = () => {
      songIndex = songTodayIndex;
      renderSong();
    };
    songCopyBtn.onclick = () => {
      const s = SONGS[songIndex];
      const text = [
        `${s.artist} — ${s.title}`,
        "",
        s.lines.join("\n"),
        "",
        s.ko,
        "",
        "핵심 표현:",
        ...s.keys.map((k) => `- ${k.en} : ${k.ko}`)
      ].join("\n");
      copyText(text, songCopyBtn, "가사 복사");
    };

    const songSpeakBtn = document.getElementById("songSpeakBtn");
    function songSpeechText(s) {
      const lines = s.lines.map((l) => l.trim()).filter((l) => l && l !== "...");
      let out = "";
      lines.forEach((l, i) => {
        if (i === 0) { out = l; return; }
        out += (/[.!?]$/.test(lines[i - 1]) ? " " : ". ") + l;
      });
      return out;
    }
    songSpeakBtn.onclick = () => {
      const s = SONGS[songIndex];
      speakText(songSpeechText(s), songSpeakBtn, "en-US");
    };

    /* ===================== 시작 ===================== */
    render();
    renderEnglish();
    renderSong();
    loadIndex().catch(() => {});
    syncSpeakButtons();
    syncSpeedButtons();
    showTab("bible");
  </script>
</body>
</html>
